const run=fn=>chain=chain.then(fn).catch(fail);
const time=()=>new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
const done=()=>{last=Date.now();stat='Synced at '+time();ui()};

async function push(p,L){L=L||loc(p);if(!L)return;const data=JSON.stringify(strip(L));if(new TextEncoder().encode(data).length>9e5)throw{code:'toolarge'};const h=hsh(p,L);
await FB.set(p.id,{name:p.name,emoji:p.emoji,salt:p.salt||'',pw:p.h||'',data,hash:h,at:Date.now()});sm(p.id,{ph:h,ch:h,at:Date.now()})}
function pull(p,cd){let nd;try{nd=JSON.parse(cd.data)}catch(e){throw{code:'bad'}}
const L=loc(p);nd.set=nd.set||{};delete nd.set.fp;if(L&&L.set&&L.set.fp)nd.set.fp=L.set.fp;if(L&&L.fc)nd.fc=L.fc;
const P=PF(),q=P.find(x=>x.id==p.id);if(q){q.name=String(cd.name||q.name);q.emoji=cd.emoji||q.emoji;q.salt=cd.salt??q.salt;q.h=cd.pw??q.h;savePF(P)}
try{localStorage.setItem(p.key,JSON.stringify(nd))}catch(e){throw{code:'storage'}}
const np=PF().find(x=>x.id==p.id);
if(cur&&cur.id==p.id){cur=np;S=nd;norm();applyTheme();save();R();sm(p.id,{ph:hsh(np,S),ch:cd.hash,at:Date.now()})}else sm(p.id,{ph:hsh(np,nd),ch:cd.hash,at:Date.now()})}
function ask(p,kind){const k=p.id+kind;if(asked[k]||$('#sh').className==='open')return;asked[k]=1;const n=esc(p.name);
if(kind=='both')sheet(`<h3>Two versions of “${n}”</h3><p class="sm">This profile changed here and on another device. Choose the version to keep. The other one is replaced.</p><div class="two"><button class="b ghost" onclick="CLOUD.pick('${p.id}','cloud')">Use cloud version</button><button class="b" onclick="CLOUD.pick('${p.id}','here')">Keep this device</button></div>`);
else sheet(`<h3>“${n}” was deleted on another device</h3><p class="sm">Remove it from this device too, or keep it and upload it again.</p><div class="two"><button class="b ghost" onclick="CLOUD.pick('${p.id}','drop')">Remove here</button><button class="b" onclick="CLOUD.pick('${p.id}','keep')">Keep and upload</button></div>`);
stat='Waiting for your choice';ui()}
async function one(p,cd){if(cd&&cd.deleted){rm(p.id,1);return}const m=meta()[p.id]||{},L=loc(p);
if(!L){if(cd)pull(p,cd);return}
const lh=hsh(p,L);
if(!cd){if(m.ch)ask(p,'gone');else await push(p,L);return}
if(lh===cd.hash){sm(p.id,{ph:lh,ch:lh,at:Date.now()});return}
if(!m.ph){if(empty(L))pull(p,cd);else ask(p,'both');return}
const lc=lh!==m.ph,cc=cd.hash!==m.ch;
if(!lc&&!cc)return;if(!lc)return pull(p,cd);if(!cc)return push(p,L);ask(p,'both')}
async function syncOneId(id){if(!user)return;const p=PF().find(x=>x.id==id);if(!p)return;if(cur&&cur.id==id)save();stat='Syncing…';ui();await one(p,await FB.get(id));if(!/choice/.test(stat))done()}
async function syncAll(){if(!user)return;stat='Syncing…';ui();if(cur)save();
const docs=await FB.list(),by={};docs.forEach(d=>by[d.id]=d);let P=PF();const m=meta();
if(P.length)for(const id in m)if(!P.some(p=>p.id==id)){if(by[id]&&!by[id].deleted)await FB.tomb(id);by[id]={id,deleted:true};dm(id)}
let add=0;docs.forEach(d=>{if(by[d.id]&&!by[d.id].deleted&&/^[A-Za-z0-9]{1,24}$/.test(d.id)&&!P.some(p=>p.id==d.id)&&!m[d.id]){P.push({id:d.id,name:String(d.name||'Profile'),emoji:d.emoji||'😊',key:d.id=='p0'?'assistant.v2':'assistant.v2.'+d.id,salt:d.salt||'',h:d.pw||''});add++}});
if(add)savePF(P);
for(const p of PF())await one(p,by[p.id]||null);
if(!/choice/.test(stat))done();
if(add&&!cur&&$('#lg .pg')&&!$('#lg input'))lgn()}
async function flush(){if(!user||!cur)return;const p=PF().find(x=>x.id==cur.id),L=p&&loc(p);if(!L)return;const m=meta()[p.id]||{};if(hsh(p,L)===m.ph)return;await syncOneId(p.id)}
function rm(id,note){const q=PF().find(x=>x.id==id);if(!q)return;const P=PF().filter(x=>x.id!=id);savePF(P);try{localStorage.removeItem(q.key)}catch(e){}if(user)dm(id);
if(cur&&cur.id==id){cur=null;closeSheet();P.length?lgn():openAcc()}else if(!cur&&$('#lg .pg')&&!$('#lg input'))lgn();
if(note)toast('“'+q.name+'” was deleted on another device')}
function drop(id){rm(id)}
function init(){if(inited||!window.FB)return;inited=true;FB.onAuth(u=>{const was=user;if(u||was)ACC(u);known=true;user=u;asked={};stat=u?'Waiting to sync':'';if(u)run(syncAll);else if(cur&&was){save();cur=null;LG()}if(tab=='set'&&cur)R();lgRe()})}
addEventListener('fb-ready',()=>{init();lgRe();if(tab=='set'&&cur)R()});
document.addEventListener('visibilitychange',()=>{if(!user)return;
if(document.visibilityState=='hidden'){if(timer){clearTimeout(timer);timer=0;run(flush)}}
else if(Date.now()-last>60000){last=Date.now();run(cur?()=>syncOneId(cur.id):syncAll)}});
addEventListener('online',()=>{if(user)run(syncAll)});
const E1=enter;enter=p=>{E1(p);if(user)run(()=>syncOneId(p.id))};
const VS=V.set;V.set=()=>{const h=VS(),i=h.lastIndexOf('</div>');return h.slice(0,i)+CLOUD.card()+h.slice(i)};
const err=t=>{const e=$('#cerr');if(e)e.textContent=t||''};
const api={
q(){if(!user)return;clearTimeout(timer);timer=setTimeout(()=>{timer=0;run(flush)},1500)},
now(){asked={};run(syncAll)},
gone(id){if(!user)return;run(async()=>{try{await FB.tomb(id)}catch(e){toast('Deleted here. It will be removed from the cloud when you are back online.');throw e}dm(id);done()})},
pick(id,how){closeSheet();run(async()=>{const p=PF().find(x=>x.id==id);if(!p)return;
if(how=='here'||how=='keep'){await push(p);done()}
else if(how=='cloud'){const cd=await FB.get(id);if(cd&&cd.deleted)rm(id,1);else if(cd)pull(p,cd);done()}
else secure(()=>{drop(id)})})},
async google(){err();if(!window.FB)return;try{await FB.google()}catch(e){err(msg(e))}},
async mail(f,create){err();const e=f.elements.e.value.trim(),p=f.elements.p.value;if(!e||!p)return err('Enter your email and password.');try{await(create?FB.signUp(e,p):FB.signIn(e,p))}catch(x){err(msg(x))}},
u:()=>user,k:()=>known,open(){setTimeout(()=>run(openAcc),0)},
async out(){try{try{await flush()}catch(e){}await FB.out()}catch(e){fail(e)}},
card(){const h='<div class="card"><h2>Cloud sync</h2>';
if(!/^https?:$/.test(location.protocol))return h+'<div class="sm">Open the app from its web address (https://) to turn on cloud sync.</div></div>';
if(window.FBERR)return h+'<div class="sm">Cloud sync could not load. Check your internet connection and reload. Everything else works as usual.</div></div>';
if(!window.FB||!known)return h+'<div class="sm">Loading…</div></div>';
if(!user)return h+`<div class="sm">Sign in to back up your profiles and keep them the same on all your devices. The app still works offline.</div><button class="b" style="width:100%;margin-top:12px" onclick="CLOUD.google()">Continue with Google</button>
<form class="fs" style="margin-top:14px" onsubmit="CLOUD.mail(this,0);return false"><label class="fld">Email<input name="e" type="email" autocomplete="email" inputmode="email"></label><label class="fld">Password<input name="p" type="password" autocomplete="current-password"></label><div class="fg"><button class="b">Sign in</button><button type="button" class="b ghost" onclick="CLOUD.mail(this.form,1)">Create account</button></div></form><div class="sm bad" id="cerr" style="margin-top:8px"></div></div>`;
return h+`<div class="g" style="overflow-wrap:anywhere"><b>${esc(user.email||user.displayName||'Signed in')}</b><div class="sm" id="cs">${esc(stat)}</div></div><div class="fg" style="margin-top:12px"><button class="b" onclick="CLOUD.now()">Sync now</button><button class="b ghost" onclick="CLOUD.out()">Sign out</button></div><div class="sm" style="margin-top:10px">Fingerprint unlock and a running focus timer stay on this device.</div></div>`}
};
if(window.FB)init();
return api})();
</script>
