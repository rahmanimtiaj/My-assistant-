<script>

const AE={'auth/operation-not-allowed':'This sign-in method is not switched on yet. Enable it in Firebase, Authentication, Sign-in method.','auth/unauthorized-domain':'This website address is not authorised. Add it in Firebase, Authentication, Settings, Authorized domains.','auth/popup-blocked':'The sign-in window was blocked. Allow pop-ups for this site and try again.','auth/popup-closed-by-user':'Sign-in was cancelled.','auth/cancelled-popup-request':'Sign-in was cancelled.','auth/invalid-credential':'Wrong email or password.','auth/wrong-password':'Wrong email or password.','auth/user-not-found':'No account with that email. Use Create account.','auth/invalid-email':'Enter a valid email address.','auth/email-already-in-use':'That email already has an account. Use Sign in.','auth/weak-password':'Use a password with at least 6 characters.','auth/network-request-failed':'No connection. Check your internet and try again.','auth/too-many-requests':'Too many attempts. Wait a few minutes and try again.','auth/operation-not-supported-in-this-environment':'Sign-in needs the app opened from an https:// address.',

const hh=s=>{let a=0xdeadbeef,b=0x41c6ce57;for(let i=0,c;i<s.length;i++){c=s.charCodeAt(i);a=Math.imul(a^c,2654435761);b=Math.imul(b^c,1597334677)}a=Math.imul(a^(a>>>16),2246822507)^Math.imul(b^(b>>>13),3266489909);b=Math.imul(b^(b>>>16),2246822507)^Math.imul(a^(a>>>13),3266489909);return(4294967296*(2097151&b)+(a>>>0)).toString(36)};
// device-only fields never leave this device: the fingerprint credential and a running focus timer
const strip=d=>{const c=JSON.parse(JSON.stringify(d||{}));delete c.fc;if(c.set)delete c.set.fp;return c};
const hsh=(p,d)=>hh(canon({n:p.name,e:p.emoji,s:p.salt||'',w:p.h||'',d:strip(d)}));
const loc=p=>{try{return JSON.parse(localStorage.getItem(p.key))}catch(e){return null}};
const meta=()=>{try{return JSON.parse(localStorage.getItem(SK+(user?user.uid:'x')))||{}}catch(e){return{}}};
const sm=(id,v)=>{const m=meta();m[id]=v;try{localStorage.setItem(SK+user.uid,JSON.stringify(m))}catch(e){}};
const dm=id=>{const m=meta();delete m[id];try{localStorage.setItem(SK+user.uid,JSON.stringify(m))}catch(e){}};
const empty=d=>!d||(!['areas','goals','habits','learn','tx','notes','items','plans','todo'].some(k=>d[k]&&d[k].length)&&!Object.keys(d.budgets||{}).length&&!Object.keys(d.income||{}).length&&!(d.ielts&&((d.ielts.mocks||[]).length||(d.ielts.study||[]).length||d.ielts.date||d.ielts.target||d.ielts.name)));
const ui=()=>{const e=$('#cs');if(e)e.textContent=stat};
const fail=e=>{stat=msg(e);ui()};

const done=()=>{last=Date.now();stat='Synced at '+time();ui()};

async function push(p,L){L=L||loc(p);if(!L)return;const data=JSON.stringify(strip(L));if(new TextEncoder().encode(data).length>9e5)throw{code:'toolarge'};const h=hsh(p,L);
await FB.set(p.id,{name:p.name,emoji:p.emoji,salt:p.salt||'',pw:p.h||'',data,hash:h,at:Date.now()});sm(p.id,{ph:h,ch:h,at:Date.now()})}
function pull(p,cd){let nd;try{nd=JSON.parse(cd.data)}catch(e){throw{code:'bad'}}

const np=PF().find(x=>x.id==p.id);

function ask(p,kind){const k=p.id+kind;if(asked[k]||$('#sh').className==='open')return;asked[k]=1;const n=esc(p.name);

async function flush(){if(!user||!cur)return;const p=PF().find(x=>x.id==cur.id),L=p&&loc(p);if(!L)return;const m=meta()[p.id]||{};if(hsh(p,L)===m.ph)return;await syncOneId(p.id)}

if(note)toast('“'+q.name+'” was deleted on another device')}

card(){const h='<div class="card"><h2>Cloud sync</h2>';
