/* ===== v3: modern 3D theme ===== */
:root{--bg:#e8ece6;--card:#fcfdfb;--bd:#d3d9d0;--mu:#56635c;--hi:rgba(255,255,255,.9);--lo:rgba(18,32,24,.11);--r:18px;

@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--hi:rgba(255,255,255,.08);--lo:rgba(0,0,0,.5);--sh1:0 1px 1px rgba(0,0,0,.5),0 6px 14px -4px rgba(0,0,0,.6),0 18px 34px -16px rgba(0,0,0,.75);--sh2:0 2px 3px rgba(0,0,0,.55),0 12px 26px -6px rgba(0,0,0,.7),0 32px 56px -22px rgba(0,0,0,.85)}}
:root[data-theme=dark]{--hi:rgba(255,255,255,.08);--lo:rgba(0,0,0,.5);--sh1:0 1px 1px rgba(0,0,0,.5),0 6px 14px -4px rgba(0,0,0,.6),0 18px 34px -16px rgba(0,0,0,.75);--sh2:0 2px 3px rgba(0,0,0,.55),0 12px 26px -6px rgba(0,0,0,.7),0 32px 56px -22px rgba(0,0,0,.85)}
html{background:var(--bg)}body{background:transparent}
body::before{content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(85% 48% at 0% 0%,color-mix(in srgb,var(--c3) 30%,transparent),transparent 72%),radial-gradient(70% 42% at 100% 6%,color-mix(in srgb,var(--c2) 20%,transparent),transparent 74%)}
#lg{background:radial-gradient(85% 48% at 0% 0%,color-mix(in srgb,var(--c3) 30%,transparent),transparent 72%),radial-gradient(70% 42% at 100% 6%,color-mix(in srgb,var(--c2) 20%,transparent),transparent 74%),var(--bg)}
.app{padding-bottom:calc(108px + var(--sab))}

input:focus,select:focus{outline:2px solid var(--c1);outline-offset:0}
/* surfaces */
.card,.kpi,.lcard{background:linear-gradient(180deg,color-mix(in srgb,var(--card) 86%,#fff) 0%,var(--card) 36%,color-mix(in srgb,var(--card) 93%,var(--bg)) 100%);border:1px solid color-mix(in srgb,var(--bd) 70%,transparent);border-radius:var(--r);box-shadow:inset 0 1px 0 var(--hi),var(--sh1)}
.card{padding:16px;margin-bottom:14px}.grid>.card{margin:0}.grid{gap:14px;margin-bottom:14px}
.ch{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;min-height:24px}.ch h2{margin:0}
.card.hero{position:relative;overflow:hidden;color:#fff;border:0;background:linear-gradient(150deg,color-mix(in srgb,var(--c3) 35%,var(--c2)) -30%,var(--c2) 28%,var(--c1) 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.4),inset 0 -3px 0 rgba(0,0,0,.14),0 18px 34px -14px color-mix(in srgb,var(--c1) 75%,transparent),0 3px 6px rgba(18,32,24,.15)}
.card.hero::before{content:'';position:absolute;inset:0;background:radial-gradient(120% 70% at 0 0,rgba(255,255,255,.26),transparent 58%);pointer-events:none}.card.hero>*{position:relative}

button.b{min-height:44px;padding:10px 16px;border-radius:13px;background:linear-gradient(180deg,color-mix(in srgb,var(--c2) 88%,#fff),var(--c1));text-shadow:0 1px 0 rgba(0,0,0,.2);box-shadow:inset 0 1px 0 rgba(255,255,255,.4),inset 0 -3px 0 rgba(0,0,0,.18),0 8px 14px -7px color-mix(in srgb,var(--c1) 75%,transparent),0 1px 2px rgba(18,32,24,.2);display:inline-flex;align-items:center;justify-content:center;gap:8px}

.chip.on{background:linear-gradient(180deg,color-mix(in srgb,var(--c2) 85%,#fff),var(--c1));border-color:var(--c1);color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.18);box-shadow:inset 0 2px 4px rgba(0,0,0,.2),0 1px 0 var(--hi)}

.seg2 button{min-height:40px;border-radius:10px}.seg2 button.on{background:linear-gradient(180deg,color-mix(in srgb,var(--card) 82%,#fff),var(--card));box-shadow:inset 0 1px 0 var(--hi),0 2px 4px -1px var(--lo),0 0 0 1px color-mix(in srgb,var(--bd) 70%,transparent)}

/* inputs */
input,select,textarea{min-height:44px;border-radius:12px;background:color-mix(in srgb,var(--bg) 62%,var(--card));border:1px solid color-mix(in srgb,var(--bd) 85%,transparent);box-shadow:inset 0 2px 4px var(--lo)}

input[type=checkbox]{width:24px;height:24px;border-radius:7px}
/* metrics, bars */
.kpis{gap:12px;margin-bottom:14px}.kpi{padding:14px;border-radius:16px}
.big{font-variant-numeric:tabular-nums}
.bar{height:10px;border-radius:6px;background:color-mix(in srgb,var(--bd) 80%,transparent);box-shadow:inset 0 2px 3px var(--lo)}
.bar i{background:linear-gradient(180deg,color-mix(in srgb,var(--c2) 70%,#fff),var(--c1));box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 0 8px -1px color-mix(in srgb,var(--c1) 55%,transparent)}
.bar.ok i{background:linear-gradient(180deg,color-mix(in srgb,var(--ok) 70%,#fff),var(--ok))}.bar.bad i{background:linear-gradient(180deg,color-mix(in srgb,var(--bad) 70%,#fff),var(--bad))}
.kt{grid-template-columns:repeat(2,minmax(0,1fr))}@media(min-width:600px){.kt{grid-template-columns:repeat(4,minmax(0,1fr))}}
