      google:async()=>{if(window.Native){const t=await natCall('google');if(!t||t[0]=='!')throw{code:'native',message:t?t.slice(1):'Sign-in cancelled'};return Au.signInWithCredential(auth,Au.GoogleAuthProvider.credential(t))}return Au.signInWithPopup(auth,new Au.GoogleAuthProvider())},
      signIn:(e,p)=>Au.signInWithEmailAndPassword(auth,e,p),
      signUp:(e,p)=>Au.createUserWithEmailAndPassword(auth,e,p),
      out:()=>Au.signOut(auth),reset:e=>Au.sendPasswordResetEmail(auth,e),reauth:p=>Au.reauthenticateWithCredential(auth.currentUser,Au.EmailAuthProvider.credential(auth.currentUser.email,p)),reauthG:async()=>{if(window.Native){const t=await natCall('google');if(!t||t[0]=='!')throw{code:'native'};return Au.reauthenticateWithCredential(auth.currentUser,Au.GoogleAuthProvider.credential(t))}return Au.reauthenticateWithPopup(auth.currentUser,new Au.GoogleAuthProvider())},
      list:async()=>(await T(Fs.getDocs(col()))).docs.map(d=>({id:d.id,...d.data()})),
      get:async id=>{const s=await T(Fs.getDoc(ref(id)));return s.exists()?s.data():null},
      set:(id,o)=>T(Fs.setDoc(ref(id),o)),
      del:id=>T(Fs.deleteDoc(ref(id))),
      tomb:id=>T(Fs.setDoc(ref(id),{deleted:true,at:Date.now()}))
    };
  }catch(e){window.FBERR=e;console.warn('Firebase did not load',e)}
  window.dispatchEvent(new Event('fb-ready'));
})();
</script>
